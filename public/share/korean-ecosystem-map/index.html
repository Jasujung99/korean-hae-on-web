<script>
(()=>{
const stage=document.getElementById('stage'),mount=document.getElementById('mount'),label=document.getElementById('zoom');let current='single',scale=1,auto=true;
const descriptions={single:'한 장 안: 전체 서비스명과 운영 관계를 압축했습니다. 서비스명 14pt, 기관명 18pt 기준입니다. 설명의 풍부함은 두 장 안과 비교해 주세요.','double-organizations':'두 장 안의 첫째: 기관명 20pt와 관계·역할 설명을 구별했습니다. 기관 코드는 둘째 지도의 서비스 운영자를 찾는 참조입니다.','double-services':'두 장 안의 둘째: 서비스명 16pt와 용도 12.5pt를 함께 담았습니다. 오른쪽 기관 코드는 첫째 지도와 연결됩니다.'};
function render(){const svg=mount.querySelector('svg');svg.style.width=`${2383.937*4/3*scale}px`;svg.style.height='auto';label.textContent=Math.round(scale*100)+'%';}
function fit(){auto=true;scale=Math.max(.04,(stage.clientWidth-52)/(2383.937*4/3));render();stage.scrollTo(0,0);}
function select(name){current=name;mount.replaceChildren(document.getElementById('poster-'+name).content.cloneNode(true));document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===name)));document.getElementById('summary').textContent=descriptions[name];document.getElementById('svg-link').href=name+'.svg';if(auto)fit();else{render();stage.scrollTo(0,0);}}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.page)));
function zoom(factor){const old=scale;const cx=(stage.scrollLeft+stage.clientWidth/2)/old,cy=(stage.scrollTop+stage.clientHeight/2)/old;auto=false;scale=Math.min(2.5,Math.max(.06,scale*factor));render();stage.scrollTo(cx*scale-stage.clientWidth/2,cy*scale-stage.clientHeight/2);}
document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.4);document.getElementById('minus').onclick=()=>zoom(1/1.4);document.getElementById('actual').onclick=()=>{auto=false;scale=1;render();stage.scrollTo(0,0);};new ResizeObserver(()=>{if(auto)fit();}).observe(stage);select(current);
})();
</script></body></html>
