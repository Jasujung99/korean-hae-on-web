function fit(){auto=true;const box=mount.querySelector('svg').viewBox.baseVal,pad=parseFloat(getComputedStyle(mount).paddingLeft)*2;scale=Math.max(.02,Math.min((stage.clientWidth-pad)/(box.width*4/3),(stage.clientHeight-pad)/(box.height*4/3)));render();stage.scrollTo(0,0);}
function select(){const key=type==='1'?variants[language]:type==='2'?'double-organizations':'double-services';mount.replaceChildren(document.getElementById('poster-'+key).content.cloneNode(true));mount.lang=type==='1'&&language==='en'?'en':'ko';document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===type)));document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===language)));document.getElementById('languages').hidden=type!=='1';document.getElementById('summary').textContent=descriptions[type];for(const ext of ['svg','pdf']){const link=document.getElementById(ext+'-link');link.href=key+'.'+ext;link.download='korean-ecosystem-map-'+key+'.'+ext;}if(auto)fit();else{render();stage.scrollTo(0,0);}}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;select();});document.getElementById('language-select').onchange=e=>{language=e.target.value;select();};
function zoom(factor){const old=scale,cx=(stage.scrollLeft+stage.clientWidth/2)/old,cy=(stage.scrollTop+stage.clientHeight/2)/old;auto=false;scale=Math.min(2.5,Math.max(.02,scale*factor));render();stage.scrollTo(cx*scale-stage.clientWidth/2,cy*scale-stage.clientHeight/2);}
document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.4);document.getElementById('minus').onclick=()=>zoom(1/1.4);document.getElementById('actual').onclick=()=>{auto=false;scale=1;render();stage.scrollTo(0,0);};new ResizeObserver(()=>{if(auto)fit();}).observe(stage);select();
})();
</script></body></html>
