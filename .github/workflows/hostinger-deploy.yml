name: Build static site for Hostinger

on:
  push:
    branches: [main]
    # 소리 앱(apps/learn)과 그 문서만 바뀐 push에는 홈페이지를 다시 만들지 않는다. 앱은 sori-deploy.yml이 올린다.
    paths-ignore:
      - "apps/learn/**"
      - "docs/adult-phoneme-app/**"
      - ".github/workflows/sori-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://haeonkorean.com

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish build output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
