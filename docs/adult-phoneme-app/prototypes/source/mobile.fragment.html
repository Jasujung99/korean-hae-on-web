function persist(){try{const p=window.openai?.setWidgetState?.({modelContent:{preview:mobile?'mobile':'pc',role:s.role,screen:s.view},privateContent:s});p?.catch(()=>{});}catch(e){}}
function button(text,action,cls='',extra=''){return `<button type="button" class="cursor-interaction ${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function dots(){return `<div class="lesson-track"><div class="track" aria-label="시안 ${s.index+1}번째 / 세 문항">${[0,1,2].map(i=>`<span class="${i<=s.index?'done':''}"></span>`).join('')}</div><span>${s.index+1} / 3</span></div>`;}
function rail(){return `<aside class="rail"><div class="rail-block"><p class="eyebrow">작은 연습, 한 묶음씩</p><h3>오늘은 ㅈ · ㅊ · ㅉ</h3><ol><li><span>01</span> 듣고 하나 고르기</li><li><span>02</span> 답을 확인하고 비교하기</li><li><span>03</span> 헷갈린 소리 다시 만나기</li></ol></div><div class="rail-block"><h3>필요할 때 비교해요</h3><p>글자보다 소리로 비교하고 싶다면 A · B · X를 들어봐요.</p>${button('두 소리 비교 열기','compare')}</div><div><span class="pill future">다음 확장</span><h3 style="margin-top:10px">소리가 단어로 이어져요</h3><p>뜻을 찾고, 생활 속 예문으로 쓰임을 확인해요.</p>${button('사전·예문 시안 보기','dictionary')}</div></aside>`;}
function quiz(){return `<section class="panel"><div class="lesson-top"><span class="pill">모음 사이 · ㅈ ㅊ ㅉ</span>${dots()}</div><div class="quiz-title"><p class="eyebrow">듣고 자음 고르기</p><h2 style="margin-top:8px">${mobile?'어떤 소리였나요?':'가운데 소리에<br>귀를 기울여요.'}</h2><p class="muted">소리를 듣고 하나를 골라 주세요.</p></div><div class="mode-nav"><button class="cursor-interaction active" data-action="quiz">듣기 퀴즈</button><button class="cursor-interaction" data-action="compare">비교 도움</button></div><div class="listen"><div class="audio-line"><div><p class="muted">어떤 소리로 들렸나요?</p><div class="jamo-motif" aria-hidden="true"><span></span><span></span><span></span><span></span></div></div>${button('<i data-lucide="volume-2" aria-hidden="true"></i>소리 듣기','audio')}</div><p class="audio-label">현재 시안은 무음입니다. 아래에서 응답 흐름을 살펴보세요.</p></div>${notice?`<p class="notice" role="status">${notice}</p>`:''}<div class="choices" aria-label="소리 선택">${syllables.map((v,i)=>`<button class="cursor-interaction ${s.choice===i?'selected':''} ${s.submitted&&keys[s.index]===i?'key':''}" data-choice="${i}" aria-pressed="${s.choice===i}" ${s.submitted?'disabled':''}>${v}<small>${s.submitted&&keys[s.index]===i?'정답 예시':s.choice===i?'내 선택':['ㅈ','ㅊ','ㅉ'][i]}</small></button>`).join('')}</div>${s.submitted?`<div class="feedback" role="status"><strong>${s.choice===keys[s.index]?'같은 소리를 골랐어요.':'두 소리를 나란히 들어봐요.'}</strong><p>피드백 예시 · 정답 ${syllables[keys[s.index]]} / 내 선택 ${syllables[s.choice]}</p><div class="pair"><button disabled>정답 소리 듣기</button><button disabled>내 선택 듣기</button></div></div>`:''}<div class="actions">${s.submitted?button(s.index===2?'이번 연습 마치기':'다음 문제 →','next','primary'):button('선택 확인','submit','primary',s.choice===null?'disabled':'')}</div><p class="resume-note"><span aria-hidden="true">↳</span> 비교 도움을 보고 돌아와도 풀던 문제는 그대로예요.</p></section><p class="flow-note">화면 전환용 3문항 · 실제 학습으로 저장되지 않아요.</p>`;}
function compare(){return `<section class="panel stack">${button('← 풀던 문제로 돌아가기','quiz','ghost')}<span class="pill">보조 연습 · 두 소리 비교</span><h2>X는 어느 쪽과 같나요?</h2><p class="muted">A, B를 듣고 마지막 X를 비교해요.</p><div class="choices" style="grid-template-columns:1fr 1fr"><button disabled>A 듣기</button><button disabled>B 듣기</button></div><button disabled>X 듣기 · 음원 준비 중</button><div class="stack">${['A와 같아요','B와 같아요'].map((v,i)=>`<button class="cursor-interaction" data-abx="${i}" aria-pressed="${abxChoice===i}">${v}</button>`).join('')}</div>${abxChoice!==null?'<p class="notice" role="status">응답 위치만 미리 보여줍니다. 음원 연결 후 비교 결과를 확인할 수 있어요.</p>':''}<p class="small">이 활동은 듣고 세 소리 중 고르는 기록과 따로 남아요.</p>${button('듣기 퀴즈로 돌아가기','quiz','primary')}</section>`;}
function finish(){return `<section class="panel stack"><div><div class="complete" aria-hidden="true">✓</div><span class="eyebrow">오늘의 짧은 연습</span><h2 style="margin-top:8px">소리의 차이를<br>하나씩 알아가요.</h2></div><p class="muted">이번에는 모음 사이의 ㅈ · ㅊ · ㅉ를 만났어요.</p><div class="notice">시안 완료 · 실제 학습 결과는 음원 연결 후 확인할 수 있어요.</div>${button('한 번 더 연습하기','restart','primary')}<div style="border-top:1px solid var(--border);padding-top:18px"><div class="row"><h3>이 소리, 단어에서는?</h3><span class="pill future">확장 시안</span></div><p class="muted" style="margin:7px 0 14px">생활 속 단어와 예문으로 연결해요.</p><div class="word-list">${words.map((w,i)=>`<button class="cursor-interaction" data-word="${i}"><strong>${w.word}</strong><small>${w.sound} · 뜻과 예문 →</small></button>`).join('')}</div></div></section>`;}
function dictionary(){const w=words[s.word];return `<section class="panel stack"><div class="row">${button('← 듣기 퀴즈','quiz','ghost')}<span class="pill future">사전·예문 확장 시안</span></div><div class="library-links" aria-label="살펴볼 단어">${words.map((v,i)=>`<button class="cursor-interaction" data-word="${i}" aria-pressed="${s.word===i}">${v.word}</button>`).join('')}</div><div><p class="small">생활 어휘 · 모음 사이 ${w.sound}</p><h2 class="dict-word">${w.word}</h2></div><div class="definition"><p class="small">뜻</p><p>${w.gloss}</p></div><button disabled>단어 듣기 · 음원 준비 중</button><div class="example"><span class="small">예문 · ${w.scene}</span><p>${w.example}</p></div><button disabled>예문 듣기 · 음원 준비 중</button><div><h3>함께 쓰는 표현</h3><p class="muted" style="margin-top:7px">${w.related}</p></div>${button(s.saved.includes(s.word)?'✓ 내 단어에 담았어요':'내 단어에 담기','save',s.saved.includes(s.word)?'':'primary')}<p class="small">단어 담기는 시안 안에서만 유지됩니다.<br>뜻·예문은 설계용 초안이며, 공개 전 검수가 필요합니다.</p></section>`;}
function learner(){const view=s.view==='quiz'?quiz():s.view==='compare'?compare():s.view==='finish'?finish():dictionary();return `<div class="workspace"><div class="stage">${view}</div>${rail()}</div>`;}
function teacher(){const list=`<aside class="learner-list"><h3>학습자 <span class="small">2명 · 예시</span></h3>${people.map((p,i)=>`<button class="person cursor-interaction" data-person="${i}" aria-pressed="${s.person===i}"><strong>${p.name}</strong><small>${p.lang} · ${p.days} 참여<br>${p.note}</small></button>`).join('')}</aside>`;if(s.person===null)return `<div class="stack"><div><p class="eyebrow">교사 관찰</p><h2>이번 학습 기록</h2><p class="small">11/9–15 · 예시 데이터</p></div>${list}</div>`;
const p=people[s.person],mat=s.position==='medial'?p.med:p.initial,total=mat.flat().reduce((a,b)=>a+b,0),correct=mat.reduce((a,r,i)=>a+r[i],0);
return `<div class="teacher-layout has-person">${list}<section class="teacher-detail">${button('← 학습자 목록','list','ghost teacher-back')}<div class="row"><div><p class="eyebrow">교사 관찰 · 학습 기록</p><h2>${p.name}</h2></div><span class="small">11/9–15 · 예시 기록</span></div><div class="stats"><div class="stat"><span class="small">활동 시간</span><strong>${p.time}</strong></div><div class="stat"><span class="small">학습한 날</span><strong>${p.days}</strong></div><div class="stat"><span class="small">최근 학습</span><strong>11/15</strong></div></div><div class="filters"><label>활동<select data-filter="task"><option value="identify">듣고 세 소리 고르기</option><option value="abx">두 소리 비교 · ABX</option></select></label><label>소리 위치<select data-filter="position"><option value="medial">모음 사이</option><option value="initial">단어 첫머리</option></select></label></div><div class="t-grid"><section class="panel stack"><div><h3>소리별 첫 응답</h3><p class="small">첫 제출 기준 · 재시도 제외</p></div>${s.task==='identify'?`<p><strong style="font-size:27px">${correct} / ${total}</strong> <span class="small">정답</span></p><div><p class="small">행: 제시 / 열: 학습자 선택</p><table aria-label="소리 혼동 기록"><thead><tr><th>제시 / 선택</th><th>ㅈ</th><th>ㅊ</th><th>ㅉ</th></tr></thead><tbody>${mat.map((row,i)=>`<tr><th>${['ㅈ','ㅊ','ㅉ'][i]}</th>${row.map((v,j)=>`<td class="${i===j?'hit':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">같은 과제·소리 위치·음원 판 기준으로 살펴봅니다.</p>`:'<p class="notice">이 활동의 예시 기록이 없습니다.</p><p class="muted">두 소리 비교는 자음 식별 점수와 합산하지 않습니다.</p>'}</section><section class="panel"><h3>최근 회기 살펴보기</h3><p class="small">11/15 · 모음 사이 · 듣고 고르기</p><div class="log-row"><span>활동 시간</span><strong>6분 20초</strong></div><div class="log-row"><span>음원 재생</span><strong>1분 12초</strong></div><div class="time-parts"><p class="small">화면을 연 전체 시간 9분 10초<br>그중 화면 이탈 2분 50초<br>실제 음원 재생은 활동 시간에 포함</p></div><div class="log-row"><span>긴 체류 문항</span><strong>7번 · 48초</strong></div><details><summary class="cursor-interaction">7번 문항의 응답·재청취</summary><p>제시 ㅈ → 첫 선택 ㅊ<br>재시도: ㅈ 선택</p><p class="small">첫 제출 전 추가 재생 3회<br>응답 대기 8초 · 화면 이탈 0초<br>문항 체류 48초 · 재시도 포함</p></details><details><summary class="cursor-interaction">중단·재개 기록</summary><p class="small">8번 문항에서 중단 → 다음 접속에서 8번부터 이어서 진행</p></details><p class="teacher-key">문항·음원 판: 예시 v1 · 재생 오류 문항은 정오답에서 제외</p></section></div><p class="flow-note">체류시간은 관찰 자료입니다. 집중도나 어려움으로 자동 판정하지 않습니다. 실제 기록과 연결하지 않은 예시입니다.</p></section></div>`;}
function render(animate=false){root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(s.role===b.dataset.role)));root.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===(s.view==='dictionary'?'dictionary':'quiz')));root.querySelector('.app-head nav').hidden=s.role==='teacher';root.querySelector('.bottom-nav').hidden=s.role==='teacher';root.querySelector('.avatar').textContent=s.role==='teacher'?'교사':'A';main.innerHTML=s.role==='learner'?learner():teacher();main.classList.toggle('slide',false);if(animate){void main.offsetWidth;main.classList.add('slide');}root.querySelectorAll('[data-filter]').forEach(el=>el.value=s[el.dataset.filter]);if(globalThis.lucide)lucide.createIcons({attrs:{width:26,height:26}});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let animate=false;notice='';if(b.dataset.role){s.role=b.dataset.role;animate=true;}else if(b.dataset.go){s.role='learner';s.view=b.dataset.go;animate=true;}else if(b.dataset.choice!==undefined){s.choice=Number(b.dataset.choice);}else if(b.dataset.abx!==undefined){abxChoice=Number(b.dataset.abx);}else if(b.dataset.person!==undefined){s.person=Number(b.dataset.person);animate=true;}else if(b.dataset.word!==undefined){s.word=Number(b.dataset.word);s.view='dictionary';animate=true;}else if(b.dataset.action){const a=b.dataset.action;if(a==='audio'){notice='음원이 아직 연결되지 않았어요. 지금은 답 선택과 화면 이동만 체험할 수 있어요.';}else if(a==='submit'){if(s.choice===null)return;s.submitted=true;}else if(a==='next'){if(s.index===2){s.view='finish';}else{s.index++;s.choice=null;s.submitted=false;}animate=true;}else if(a==='restart'){s.view='quiz';s.index=0;s.choice=null;s.submitted=false;animate=true;}else if(['quiz','compare','dictionary'].includes(a)){s.view=a;animate=true;}else if(a==='save'){s.saved=s.saved.includes(s.word)?s.saved.filter(w=>w!==s.word):[...s.saved,s.word];}else if(a==='list'){s.person=null;animate=true;}}else return;render(animate);persist();});
root.addEventListener('change',e=>{if(e.target.dataset.filter){s[e.target.dataset.filter]=e.target.value;render();persist();}});
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data){restore(data);render();}});
render();
})();
</script>
</div>
